name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r release/requirements.txt
      - run: npm run test:gates
      - run: npm run test:release-smoke
      - run: npm run verify:facts
      # Test the committed corpus and media, exactly as Netlify builds them.
      - run: npm run build:release
      - run: npm run check
      - run: npm test
      - run: node_modules/.bin/tsx --test --test-timeout=120000 tests/system.test.ts
      - run: git diff --exit-code -- content lib/agent public ':!content/audit.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: docs/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r release/requirements.txt
      - run: python -m playwright install --with-deps chrome
      - run: npm run build:release
      - name: Browser journeys on the production build
        shell: bash
        run: |
          mkdir -p docs
          npm run start -- --port 3217 > docs/browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3217/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3217/api/health > docs/health.json
          node scripts/release-smoke.mjs http://localhost:3217
          FILM_ORIGIN=http://localhost:3217 python3 scripts/ui-journeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            .claude/ux-evidence/
            docs/

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require live provider evidence
        run: test -n "$NVIDIA_API_KEY$OPENROUTER_API_KEY"
      - run: npm run test:agent
      - run: npm run test:agent:faults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evidence
          path: docs/agent-bench/

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:links
