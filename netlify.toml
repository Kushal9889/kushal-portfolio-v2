# Next.js on Netlify. The plugin wires the App Router's server routes to
# Netlify Functions; without it the API routes 404 and the agent is a dead box.
[build]
  command = "npm run verify:facts && npm run build:release && npm run check && npm run test:unit"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Previews are review artifacts; production retains all blocking checks above.
[context.deploy-preview]
  command = "npm run verify:facts && npm run build:release && npm run test:unit"
